name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax
        run: python -m py_compile app.py && echo "Syntax OK"

      - name: Run tests
        # ANTHROPIC_API_KEY is loaded from GitHub Secrets.
        # Tests that actually call the API are skipped in CI if the secret
        # isn't present (see tests/test_app.py for the skip logic).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pytest tests/ -v --tb=short
